/* ==========================================================================
   NAV — Centric's floating glass bar with the travelling lens
   ========================================================================== */
const tabBlob = document.createElement('span');
tabBlob.className = 'tabblob';
$('.tabs').prepend(tabBlob);
let blobFlight = null;
function slotOf(btn){ const b = btn.getBoundingClientRect(), bar = $('.tabs').getBoundingClientRect(); return { x: b.left - bar.left, w: b.width }; }
function moveBlob(animate){
  const on = $('.tabs button.on'); if(!on) return;
  const s = slotOf(on), prev = parseFloat(tabBlob.style.getPropertyValue('--bx')) || 0;
  if (animate && Math.abs(prev - s.x) > 1){ tabBlob.classList.add('moving'); clearTimeout(blobFlight); blobFlight = setTimeout(()=>tabBlob.classList.remove('moving'), 560); }
  tabBlob.style.setProperty('--bx', s.x + 'px'); tabBlob.style.width = s.w + 'px';
}
let blobFollow = 0;
function followBlob(ms){
  const until = performance.now() + ms; tabBlob.classList.add('track'); cancelAnimationFrame(blobFollow);
  const step = ()=>{ moveBlob(false); if (performance.now() < until) blobFollow = requestAnimationFrame(step); else tabBlob.classList.remove('track'); };
  step();
}
addEventListener('resize', ()=>followBlob(60));
$$('.tabs button').forEach(b=>{ const t=[...b.childNodes].find(n=>n.nodeType===3 && n.textContent.trim()); if(!t) return;
  const sp=document.createElement('span'); sp.className='tl'; sp.textContent=t.textContent.trim(); t.replaceWith(sp); });
const navBar = $('.tabs'); navBar.style.touchAction = 'none';
let navDrag = null;
function tabNearestX(x){ let best=null, bestD=Infinity;
  $$('.tabs button').forEach(b=>{ const r=b.getBoundingClientRect(), d=Math.abs(x-(r.left+r.width/2)); if(d<bestD){ bestD=d; best=b; } }); return best; }
navBar.addEventListener('pointerdown', e=>{ if(!e.target.closest('button')) return; navDrag = { x0:e.clientX, id:e.pointerId, moved:false, target:null }; navBar.classList.add('pressing'); });
const navSpring = { x:0, v:0, target:0, raf:null };
function navTick(){
  navSpring.v += (navSpring.target - navSpring.x) * 0.26; navSpring.v *= 0.74; navSpring.x += navSpring.v;
  const stretch = Math.min(Math.abs(navSpring.v) * 0.011, 0.20);
  tabBlob.style.setProperty('--bx', navSpring.x.toFixed(2) + 'px');
  tabBlob.style.setProperty('--sx', (1 + stretch).toFixed(3)); tabBlob.style.setProperty('--sy', (1 - stretch * 0.55).toFixed(3));
  navSpring.raf = requestAnimationFrame(navTick);
}
navBar.addEventListener('pointermove', e=>{
  if(!navDrag || e.pointerId !== navDrag.id) return;
  if(!navDrag.moved){
    if(Math.abs(e.clientX - navDrag.x0) < 8) return;
    navDrag.moved = true; try{ navBar.setPointerCapture(navDrag.id); }catch(_){}
    navBar.classList.remove('pressing'); navBar.classList.add('dragging'); tabBlob.classList.add('moving'); clearTimeout(blobFlight);
    navSpring.x = parseFloat(tabBlob.style.getPropertyValue('--bx')) || 0; navSpring.v = 0; cancelAnimationFrame(navSpring.raf); navTick();
  }
  const t = tabNearestX(e.clientX); navDrag.target = t;
  $$('.tabs button').forEach(b=>b.classList.toggle('on', b===t));
  const br = navBar.getBoundingClientRect(), s = slotOf(t); tabBlob.style.width = s.w + 'px';
  navSpring.target = Math.max(2, Math.min(br.width - s.w - 2, e.clientX - br.left - s.w/2));
});
function endNavDrag(e){
  if(!navDrag) return; const wasDrag = navDrag.moved, target = navDrag.target; navDrag = null; navBar.classList.remove('pressing');
  if(!wasDrag) return;
  cancelAnimationFrame(navSpring.raf); navSpring.raf = null; tabBlob.style.setProperty('--sx', 1); tabBlob.style.setProperty('--sy', 1);
  navBar.classList.remove('dragging');
  const v = (target || tabNearestX(e.clientX)).dataset.v; if(v !== activeView) show(v); else moveBlob();
  clearTimeout(blobFlight); blobFlight = setTimeout(()=>tabBlob.classList.remove('moving'), 420);
}
['pointerup','pointercancel'].forEach(ev => navBar.addEventListener(ev, endNavDrag));
let navLastY = 0;
addEventListener('scroll', ()=>{
  const y = Math.max(0, window.scrollY); if (Math.abs(y - navLastY) < 12) return;
  const down = y > navLastY; navLastY = y; const bar = $('.tabs'), want = down && y > 90;
  if (want === bar.classList.contains('min')) return; bar.classList.toggle('min', want); followBlob(360);
}, {passive:true});
$$('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- pull to refresh ---------- */
const PTR_ARM = 64, PTR_MAX = 96;
let ptrY0 = null, ptrPull = 0, ptrBusy = false;
function ptrAtTop(){ return document.body.classList.contains('paged') ? $('#page').scrollTop <= 0 : window.scrollY <= 0; }
function ptrBlocked(e){ return !!(document.querySelector('#xsheet.show') || (e.target.closest && e.target.closest('input,textarea,select'))); }
function ptrPaint(px, armed){ const el = $('#ptr'); el.style.transition = 'none'; el.style.opacity = Math.min(1, px / PTR_ARM);
  el.style.transform = `translate(-50%, ${px - 56}px) rotate(${px * 3.2}deg)`; el.classList.toggle('armed', !!armed); }
function ptrSpin(on){ const el = $('#ptr'); ptrBusy = on; el.style.transition = 'transform .25s ease, opacity .25s ease';
  if (on){ el.classList.add('spin'); el.style.opacity = 1; el.style.transform = 'translate(-50%, 8px)'; }
  else { el.classList.remove('spin','armed'); el.style.opacity = 0; el.style.transform = 'translate(-50%, -56px)'; } }
window.addEventListener('touchstart', e=>{ if (ptrBusy || loading || e.touches.length !== 1 || !ptrAtTop() || ptrBlocked(e) || $('#app').hidden){ ptrY0 = null; return; }
  ptrY0 = e.touches[0].clientY; ptrPull = 0; }, { passive:true });
window.addEventListener('touchmove', e=>{ if (ptrY0 == null) return; const dy = e.touches[0].clientY - ptrY0;
  if (dy <= 0 || !ptrAtTop()){ if (ptrPull) ptrPaint(0,false); ptrPull = 0; return; }
  ptrPull = Math.min(PTR_MAX, dy * 0.5); ptrPaint(ptrPull, ptrPull >= PTR_ARM); }, { passive:true });
window.addEventListener('touchend', ()=>{ if (ptrY0 == null) return; const go = ptrPull >= PTR_ARM; ptrY0 = null; ptrPull = 0;
  if (go){ if (navigator.vibrate) navigator.vibrate(8); refresh(true); } else ptrSpin(false); }, { passive:true });

let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

/* ==========================================================================
   PAGES — profile and category detail slide over the tabs
   ========================================================================== */
let pageStack = [];
function pushPage(p){
  pageStack.push(p); try{ history.pushState({ pg: pageStack.length }, ''); }catch(e){}
  const el = $('#page'), opening = el.hidden;
  if (opening){ el.hidden = false; document.body.classList.add('paged'); }
  renderPage(); el.scrollTop = 0;
  if (opening) requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
}
let backFromButton = false;
function popPage(){ if (history.state && history.state.pg){ backFromButton = true; history.back(); } else popPageNow(); }
function popPageNow(instant){
  pageStack.pop(); const el = $('#page'); el.style.transition = instant ? 'none' : '';
  if (pageStack.length){ renderPage(); el.scrollTop = 0; return; }
  el.classList.remove('show'); document.body.classList.remove('paged');
  setTimeout(()=>{ if(!pageStack.length){ el.hidden = true; el.innerHTML = ''; } }, 300);
}
window.addEventListener('popstate', e=>{
  const want = (e.state && e.state.pg) || 0, ours = backFromButton; backFromButton = false;
  if ($('#xsheet').classList.contains('show')) closeX();
  if (!ours && pageStack.length > want){ const el = $('#page'); while (pageStack.length > want) popPageNow(true);
    if (!pageStack.length){ el.style.transition='none'; el.hidden = true; el.innerHTML=''; } requestAnimationFrame(()=>{ el.style.transition=''; }); return; }
  while (pageStack.length > want) popPageNow();
});
try{ if (!history.state) history.replaceState({ pg: 0 }, ''); }catch(e){}

const pageTitle = p => p.kind==='profile' ? 'Profile' : p.cat;
function renderPage(){
  const p = pageStack[pageStack.length-1]; if (!p) return;
  const prev = pageStack[pageStack.length-2];
  const back = prev ? pageTitle(prev) : TITLES[activeView];

}

/* ==========================================================================
   ADD / EDIT SHEET — Centric's entry flow: big amount and keypad, chips that
   open pickers, small boxes for text. Modes: expense, fund, settle; plus
   budget and sub for budget lines.
   ========================================================================== */
let X = {};          // the form being edited
const X_OPS = ['+','−','×','÷'];
function openX(mode, rec){
  if (!D){ toast('Still loading'); return; }
  const A = D.config.person_a, B = D.config.person_b;
  let acct = ''; if (mode==='expense' && !rec) acct = lsGet(LS.acct) || '';
  X = { mode, rec: rec || null, field: null, openCat: '', fresh: false, err: '',
    expr: rec && rec.amount ? String(rec.amount) : rec && mode==='budget' ? String(rec.budgeted||'') : '',
    date: rec && rec.date || todayISO(), cat: rec && rec.category || '', sub: rec && rec.subcategory || '',
    acct: rec ? (rec.account || '') : acct, who: rec && rec.paidBy || A, person: rec && rec.person || A,
    from: rec && rec.from || B, to: rec && rec.to || A, note: rec && rec.note || '', name: '' };
  if (mode==='expense' && !rec) X.field = 'amount';
  if (mode==='budget' || mode==='sub') X.field = 'amount';
  if (X.expr) X.fresh = true;
  paintX();
  $('#backdrop').hidden = false; $('#xsheet').hidden = false;
  requestAnimationFrame(()=>{ $('#backdrop').classList.add('show'); $('#xsheet').classList.add('show'); });
}
function closeX(){ $('#backdrop').classList.remove('show'); $('#xsheet').classList.remove('show');
  setTimeout(()=>{ if ($('#xsheet').classList.contains('show')) return; $('#backdrop').hidden = true; $('#xsheet').hidden = true; }, 280); }
$('#backdrop').onclick = closeX;

const xEval = s => { const t = String(s||'').replace(/[+−×÷.]+$/,''); if (!t) return 0;
  const toks = t.match(/\d*\.?\d+|[+−×÷]/g) || []; let sum=0, sign=1, term=null, mul=null;
  toks.forEach(k=>{ if (k==='+'||k==='−'){ sum += sign*(term||0); sign = k==='−'?-1:1; term=null; mul=null; }
    else if (k==='×'||k==='÷') mul = k; else { const v = parseFloat(k); term = term==null ? v : mul==='÷' ? (v?term/v:term) : term*v; mul=null; } });
  sum += sign*(term||0); return Math.round(sum*100)/100; };
const xHasOp = s => /[+−×÷]/.test(String(s).slice(1));
const xAmt = () => xEval(X.expr);
function xKey(k){
  let s = X.expr;
  if (X.fresh){ X.fresh = false; if (/^\d+$/.test(k) || k==='.') s = ''; }
  if (/^\d+$/.test(k)){ const cur = s.split(/[+−×÷]/).pop(); if (/\.\d\d$/.test(cur)) return; if (cur==='0' && k!=='.') s = s.slice(0,-1); s += k; }
  else if (k==='.'){ const cur = s.split(/[+−×÷]/).pop(); if (!cur.includes('.')) s += cur==='' ? '0.' : '.'; }
  else if (X_OPS.includes(k)){ if (!s) return; s = X_OPS.includes(s.slice(-1)) ? s.slice(0,-1)+k : s+k; }
  else if (k==='=') { if (s) s = String(xEval(s)); }
  else if (k==='⌫') s = s.slice(0,-1);
  else if (k==='C') s = '';
  X.expr = s;
}
const xKeypad = ok => `<div class="xkp">${['+','−','×','÷','7','8','9','=','4','5','6','.','1','2','3','⌫','C','0','00','OK']
  .map(k=>k==='OK' ? `<button class="ok" data-k="OK">${esc(ok)}</button>` : `<button class="${/\d/.test(k)?'':'op'}" data-k="${k}">${k}</button>`).join('')}</div>`;
const xDateLabel = () => { const t = todayISO(), y = new Date(Date.now()-864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10), v = X.date || t;
  if (v===t) return 'Today'; if (v===y) return 'Yesterday'; return dmy(v); };
const ph = t => `<span class="ph">${esc(t)}</span>`;

// which pick-chips each mode shows, in order (the keypad is always first)
const xChips = () => ({ expense:['category','account','who'], fund:['person'], settle:['from','to'], budget:[], sub:[] })[X.mode];
const xLabels = { category:'Category', account:'Account', who:'Paid by', person:'Who', from:'From', to:'To' };
function chipVal(f){
  if (f==='category') return X.cat ? esc(X.cat + (X.sub ? ' › ' + X.sub : '')) : '';
  if (f==='account') return X.acct ? esc(X.acct) : '';
  return esc({ who:X.who, person:X.person, from:X.from, to:X.to }[f] || '');
}
function chipIcon(f){
  if (f==='category') return X.cat ? xTile(X.cat) : '';
  if (f==='account') return X.acct ? accMark(X.acct) : '';
  const n = { who:X.who, person:X.person, from:X.from, to:X.to }[f]; return n ? personMark(n) : '';
}
const xTitle = () => { const ed = !!X.rec;
  return { expense: ed ? 'Edit expense' : 'New expense', fund: ed ? 'Edit funds' : 'Log funds', settle: ed ? 'Edit settlement' : 'Settlement', budget:'Edit budget', sub:'New subcategory' }[X.mode]; };
const xHint = () => ({ expense:'Saved to the Expenses tab in your Construction Budget sheet.', fund:'Saved to the Funds tab.', settle:'Money one of you paid the other to even out the split. Saved to the Settlements tab.',
  budget:'Changes the Budget tab line for this subcategory.', sub:'Adds a line to the Budget tab under ' + (X.rec && X.rec.category || '') + '.' })[X.mode];

function xPanel(){
  const f = X.field; if (!f) return '';
  let body = '';
  if (f==='amount') body = xKeypad(X.mode==='expense' ? 'Next' : 'Done');
  else if (f==='category') body = xCatGrid();
  else if (f==='account') body = `<div class="xacc"><div class="xgrid pills">${accountList().map(a=>`<button class="${a===X.acct?'on':''}" data-a="${esc(a)}">${accMark(a)}<span>${esc(a)}</span></button>`).join('')}</div>
    ${accountList().length ? '' : '<div class="empty">Add accounts on the sheet’s Config tab</div>'}</div>`;
  else { const cur = { who:X.who, person:X.person, from:X.from, to:X.to }[f];
    const opts = [D.config.person_a, D.config.person_b].filter(n => f!=='to' || n!==X.from);
    body = `<div class="xacc"><div class="xgrid pills">${opts.map(n=>`<button class="${n===cur?'on':''}" data-p="${esc(n)}">${personMark(n)}<span>${esc(n)}</span></button>`).join('')}</div></div>`; }
  return `<div class="xpanel"><div class="xph"><span>${esc(f==='amount' ? 'Amount' : xLabels[f])}</span><button data-hide>Done</button></div><div class="xpb">${body}</div></div>`;
}
function xCatGrid(){
  const items = catsList(); let out = '';
  for (let i=0;i<items.length;i+=3){
    const row = items.slice(i,i+3);
    out += row.map(v=>{ const subs = subsOf(v);
      return `<button class="${v===X.cat?'on':''} ${v===X.openCat?'op':''}" data-c="${esc(v)}">${xTile(v)}<span>${esc(v)}</span>${subs.length?`<i class="cv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${v===X.openCat?'M6 15l6-6 6 6':'M6 9l6 6 6-6'}"/></svg></i>`:''}</button>`; }).join('');
    for (let k=row.length;k<3;k++) out += '<b></b>';
    if (row.includes(X.openCat)){
      out += `<div class="xsubrow" style="--nx:${row.indexOf(X.openCat)}">${subsOf(X.openCat).map(s=>`<button class="chip ${s===X.sub&&X.cat===X.openCat?'on':''}" data-sub="${esc(s)}">${esc(s)}</button>`).join('')}
        <button class="chip ghost" data-sub="">No subcategory</button></div>`;
    }
  }
  return `<div class="xgrid tiles">${out}</div>`;
}
function amtHtml(){ return X.expr ? `<b class="num">${xHasOp(X.expr) ? esc(X.expr) + ` <small>= ${fINR2(xAmt())}</small>` : fINR2(xAmt())}</b>` : ph('₹0'); }

function paintX(){
  const el = $('#xsheet'), ed = !!X.rec;
  const seg = !ed && (X.mode==='expense' || X.mode==='fund' || X.mode==='settle')
    ? `<div class="seg xseg">${[['expense','Expense'],['fund','Funds'],['settle','Settle']].map(([m,l])=>`<button data-m="${m}" class="${X.mode===m?'on':''}">${l}</button>`).join('')}</div>` : '';
  const chips = xChips().map(f=>{ const v = chipVal(f), ic = chipIcon(f);
    return `<button class="xfr tap xa-chip ${X.field===f?'on':''} ${ic?'':'noic'}" data-f="${f}">${ic}<span class="v">${v || ph(xLabels[f])}</span></button>`; }).join('');
  const box = (id, k, val, phv) => `<div class="xfr xa-in" data-f="${id}"><span class="k">${esc(k)}</span><span class="v"><input id="${id}" placeholder="${esc(phv)}" value="${esc(val)}" autocomplete="off"></span><button type="button" class="xa-x ${val?'show':''}" aria-label="Clear ${esc(k)}"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>`;
  const boxes = X.mode==='sub' ? box('xName','Name', X.name, 'e.g. Waterproofing')
    : X.mode==='budget' ? '' : box('xNote','Note', X.note, X.mode==='expense' ? 'What was it for' : 'optional');
  const top = X.mode==='budget' ? `<div class="xbudget">${xTile(X.rec.category)}<div><b>${esc(X.rec.subcategory || '—')}</b><span>${esc(X.rec.category)} · spent ${fINR(calc().cats.find(k=>k.name===X.rec.category)?.subs.find(s=>s.subcategory===X.rec.subcategory)?.spent || 0)}</span></div></div>` : '';
  const dateRow = (X.mode==='budget' || X.mode==='sub') ? '' : `<label class="xa-date"><span>${esc(xDateLabel())}</span><input type="date" id="xDate" value="${esc(X.date)}" aria-label="Date"></label>`;
  el.innerHTML = `<div class="grab"></div><div class="xhd"><h3>${esc(xTitle())}</h3><button data-close>Cancel</button></div>
    <div class="xscroll">${seg}${X.err?`<div class="err">${esc(X.err)}</div>`:''}${top}
      <div class="xa"><div class="xfr tap xa-amt ${X.field==='amount'?'on':''}" data-f="amount"><span class="v">${amtHtml()}</span></div>
        ${dateRow}<div class="xa-chips">${chips}</div><div class="xa-ins">${boxes}</div></div>
      <button class="btn" data-save>${X.mode==='budget' ? 'Save budget' : X.mode==='sub' ? 'Add subcategory' : 'Save'}</button>
      ${ed && (X.mode==='expense' || X.mode==='fund' || X.mode==='settle') ? '<button class="btn danger" data-del>Delete</button>' : ''}
      <p class="hint">${esc(xHint())}</p></div>${xPanel()}`;
  wireX(el);
  const t = $('.xa-amt .v b', el); if (t) t.classList.toggle('xfresh', X.fresh && !!X.expr);
}
function grab(){ const n = $('#xNote'), nm = $('#xName'), d = $('#xDate'); if (n) X.note = n.value; if (nm) X.name = nm.value; if (d) X.date = d.value || X.date; }
function xNext(){
  const order = ['amount', ...xChips()];
  const i = order.indexOf(X.field);
  const nxt = order.slice(i+1).find(f=>!chipVal(f) || f==='category');
  X.field = nxt || null; paintX();
  if (!X.field){ const inp = $('#xNote') || $('#xName'); if (inp && !inp.value) inp.focus(); }
}
function wireX(el){
  $('[data-close]', el).onclick = closeX;
  $$('[data-m]', el).forEach(b=>b.onclick=()=>{ grab(); const keep = { expr:X.expr, date:X.date, note:X.note };
    openX(b.dataset.m); Object.assign(X, keep, { fresh:!!keep.expr }); paintX(); });
  $$('.xfr.tap', el).forEach(r=>r.onclick=()=>{ grab(); X.field = X.field===r.dataset.f ? null : r.dataset.f; X.openCat=''; paintX(); });
  $$('.xa-in input', el).forEach(i=>{ i.addEventListener('focus', ()=>{ if (X.field){ grab(); X.field = null; const p = $('.xpanel', el); if (p) p.remove(); $$('.xfr.on', el).forEach(r=>r.classList.remove('on')); } });
    i.addEventListener('input', ()=>{ const x = i.closest('.xa-in').querySelector('.xa-x'); if (x) x.classList.toggle('show', !!i.value); }); });
  $$('.xa-x', el).forEach(x=>{ const clear = ()=>{ const i = x.closest('.xa-in').querySelector('input'); i.value=''; x.classList.remove('show'); grab(); };
    x.addEventListener('touchstart', e=>{ e.preventDefault(); clear(); }, { passive:false }); x.addEventListener('mousedown', e=>e.preventDefault()); x.onclick = clear; });
  const d = $('#xDate', el); if (d) d.addEventListener('change', ()=>{ X.date = d.value || X.date; const l = $('.xa-date span', el); if (l) l.textContent = xDateLabel(); });
  const hide = $('[data-hide]', el); if (hide) hide.onclick = ()=>{ grab(); X.field = null; paintX(); };
  $$('.xkp button', el).forEach(b=>b.onclick=()=>{ const k = b.dataset.k;
    if (k==='OK'){ if (xHasOp(X.expr)) X.expr = String(xAmt()); grab(); xNext(); return; }
    xKey(k); const v = $('.xa-amt .v', el); if (v) v.innerHTML = amtHtml(); });
  $$('.xgrid [data-c]', el).forEach(b=>b.onclick=()=>{ grab(); const c = b.dataset.c;
    if (X.cat!==c){ X.cat = c; X.sub = ''; }
    if (subsOf(c).length && X.openCat!==c){ X.openCat = c; paintX(); const sr = $('#xsheet .xsubrow'); if (sr) sr.scrollIntoView({ block:'nearest', behavior:'smooth' }); return; }
    X.openCat = ''; xNext(); });
  $$('.xgrid [data-sub]', el).forEach(b=>b.onclick=()=>{ grab(); X.sub = b.dataset.sub; X.cat = X.openCat || X.cat; X.openCat=''; xNext(); });
  $$('.xgrid [data-a]', el).forEach(b=>b.onclick=()=>{ grab(); X.acct = b.dataset.a; xNext(); });
  $$('.xgrid [data-p]', el).forEach(b=>b.onclick=()=>{ grab(); const f = X.field, v = b.dataset.p;
    if (f==='who') X.who = v; else if (f==='person') X.person = v; else if (f==='from'){ X.from = v; if (X.to===v) X.to = [D.config.person_a, D.config.person_b].find(n=>n!==v); } else X.to = v;
    xNext(); });
  $('[data-save]', el).onclick = saveX;
  const del = $('[data-del]', el); if (del) del.onclick = async ()=>{
    if (del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='Tap again to delete'; return; }
    const act = { expense:'deleteExpense', fund:'deleteFund', settle:'deleteSettlement' }[X.mode];
    const was = { date:X.rec.date, amount:X.rec.amount };
    await post(act, { id: X.rec.id, was }, { expense:'Expense deleted', fund:'Funds entry deleted', settle:'Settlement deleted' }[X.mode]); };
}
async function saveX(){
  grab();
  const amt = xAmt(), m = X.mode;
  const fail = msg => { X.err = msg; paintX(); $('#xsheet .xscroll').scrollTop = 0; };
  if (m==='sub'){ if (!X.name.trim()) return fail('Give the subcategory a name');
    if (subsOf(X.rec.category).includes(X.name.trim())) return fail('That subcategory already exists');
    return post('addSubcategory', { category:X.rec.category, subcategory:X.name.trim(), budgeted:amt }, 'Subcategory added'); }
  if (m==='budget') return post('setBudget', { category:X.rec.category, subcategory:X.rec.subcategory, budgeted:amt }, 'Budget updated');
  if (!(amt > 0)) return fail('Enter an amount');
  if (m==='expense'){
    if (!X.cat) return fail('Pick a category');
    const p = { date:X.date, account:X.acct, category:X.cat, subcategory:X.sub, note:X.note.trim(), amount:amt, paidBy:X.who };
    if (X.rec){ p.id = X.rec.id; p.was = { date:X.rec.date, amount:X.rec.amount }; return post('updateExpense', p, 'Expense updated'); }
    if (X.acct) lsSet(LS.acct, X.acct);
    return post('addExpense', p, 'Expense saved');
  }
  const was = X.rec ? { id:X.rec.id, was:{ date:X.rec.date, amount:X.rec.amount } } : null;
  if (m==='fund'){ const p = { date:X.date, person:X.person, amount:amt, note:X.note.trim() };
    return was ? post('updateFund', Object.assign(p, was), 'Funds entry updated') : post('addFund', p, 'Funds logged'); }
  if (m==='settle'){ if (X.from===X.to) return fail('From and To must be different');
    const p = { date:X.date, from:X.from, to:X.to, amount:amt, mode: X.rec && X.rec.mode || '', note:X.note.trim() };
    return was ? post('updateSettlement', Object.assign(p, was), 'Settlement updated') : post('addSettlement', p, 'Settlement recorded'); }
}
async function post(action, payload, okMsg, force){
  const btn = $('#xsheet [data-save]'); if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const reset = ()=>{ if (btn){ btn.disabled = false; btn.textContent = 'Save'; } };
  try{
    const j = await apiPost(action, payload, force);
    if (!j.ok && j.error==='duplicate'){ if (confirm('An identical entry already exists. Add it anyway?')) return post(action, payload, okMsg, true); reset(); return; }
    if (!j.ok && j.error==='stale'){ closeX(); toast('That entry changed in the sheet. Refreshed — try again.'); refresh(false); return; }
    if (!j.ok && j.error==='bad_passcode'){ closeX(); [LS.pass].forEach(lsDel); showSetup('Your saved passcode no longer works.'); return; }
    if (!j.ok) throw new Error(j.error==='unknown_action' ? 'The sheet script needs updating to allow this' : j.error);
    setData(j.data); render(); closeX(); toast(okMsg); setStatus('Updated just now','');
  }catch(e){ X.err = e.message && e.message!=='Failed to fetch' ? e.message : 'Could not save — check your connection'; reset(); paintX(); }
}

/* Swipe the sheet down to dismiss it, like an iOS sheet. */
(function sheetSwipe(){
  let y0 = null, x0 = 0, dy = 0, t0 = 0, vert = null;
  const el = () => $('#xsheet');
  document.addEventListener('touchstart', e=>{ const s = el(); if (s.hidden || !s.classList.contains('show') || e.touches.length !== 1 || !s.contains(e.target)) return;
    const onHandle = e.target.closest('.xhd'), inner = e.target.closest('.xscroll, .xpb');
    if (!onHandle && ((inner && inner.scrollTop > 0) || e.target.closest('input,textarea,select,.xkp'))) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); vert = null; }, { passive:true });
  document.addEventListener('touchmove', e=>{ if (y0 == null) return; const s = el(), my = e.touches[0].clientY - y0, mx = e.touches[0].clientX - x0;
    if (vert == null && (Math.abs(my) > 6 || Math.abs(mx) > 6)) vert = Math.abs(my) > Math.abs(mx) && my > 0;
    if (!vert){ if (vert === false) y0 = null; return; }
    dy = Math.max(0, my); if (e.cancelable) e.preventDefault(); s.style.transition = 'none'; s.style.transform = `translateY(${dy}px)`; }, { passive:false });
  const end = ()=>{ if (y0 == null) return; const s = el(), fast = dy > 40 && dy / Math.max(1, Date.now()-t0) > 0.6; y0 = null; s.style.transition = '';
    s.style.transform = ''; if (dy > s.offsetHeight * 0.25 || dy > 140 || fast) closeX(); };
  document.addEventListener('touchend', end, { passive:true }); document.addEventListener('touchcancel', end, { passive:true });
})();

/* ==========================================================================
   SETUP + START
   ========================================================================== */
function showSetup(msg){
  $('#app').hidden = true; $('#setup').hidden = false;
  $('#urlField').hidden = !!API;
  if (msg){ $('#setupErr').textContent = msg; $('#setupErr').hidden = false; }
}
$('#btnConnect').onclick = async ()=>{
  const err = m => { $('#setupErr').textContent = m; $('#setupErr').hidden = false; $('#btnConnect').textContent = 'Open'; $('#btnConnect').disabled = false; };
  if (!$('#urlField').hidden){ const u = $('#inUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return err('That should be your Apps Script URL, ending in /exec.'); API = u; }
  pass = $('#inKey').value.trim(); if (!pass) return err('Enter your passcode.');
  $('#btnConnect').textContent = 'Checking…'; $('#btnConnect').disabled = true;
  try{ setData(await apiGet()); lsSet(LS.pass, pass); lsSet(LS.api, API); start(); }
  catch(e){ err(e.kind==='auth' ? 'That passcode did not work.' : 'Could not reach the sheet. Check your connection and try again.'); }
};
$('#inKey').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#btnConnect').click(); });
$('#buildStamp2').textContent = 'App ' + BUILD;

function start(){
  $('#setup').hidden = true; $('#app').hidden = false;
  if (D){ render(); paintSub(); }
  requestAnimationFrame(()=>moveBlob(false));
  if (!D || Date.now()-syncedAt() > 30000) refresh(false);
}
if (pass && API) start(); else showSetup();
</script>
<script>
/* One floating × for whichever free-text field has focus and some text: tap it to
   empty the field (an input event follows, so the app sees the change). Date, month,
   search (it has its own), checkbox and file fields are left alone. */
(function(){
  const btn = document.createElement('button'); btn.id = 'xclr'; btn.type = 'button'; btn.setAttribute('aria-label','Clear');
  btn.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
  document.body.appendChild(btn);
  let cur = null;
  const ok = el => el && el.tagName==='INPUT' && !el.closest('.xa-in') && !el.readOnly && !el.disabled && !/^(date|month|time|datetime-local|search|checkbox|radio|file|hidden|range|color|button|submit)$/i.test(el.type||'text');
  const place = ()=>{
    if (!cur || !document.body.contains(cur) || !cur.value){ btn.classList.remove('show'); return; }
    const r = cur.getBoundingClientRect(); if (!r.width){ btn.classList.remove('show'); return; }
    btn.style.left = (r.right - 26) + 'px'; btn.style.top = (r.top + r.height/2 - 11) + 'px'; btn.classList.add('show');
  };
  document.addEventListener('focusin', e=>{ if (cur && cur!==e.target) cur.classList.remove('has-clr'); cur = ok(e.target) ? e.target : null; if (cur) cur.classList.add('has-clr'); place(); });
  document.addEventListener('focusout', e=>{ setTimeout(()=>{ if (document.activeElement!==cur){ if (cur) cur.classList.remove('has-clr'); cur = null; place(); } }, 0); });
  document.addEventListener('input', e=>{ if (e.target===cur) place(); });
  window.addEventListener('scroll', place, true); window.addEventListener('resize', place);
  // keep focus on the field while tapping ×
  btn.addEventListener('pointerdown', e=>e.preventDefault());
  btn.addEventListener('mousedown', e=>e.preventDefault());
  btn.addEventListener('click', ()=>{ if (!cur) return; cur.value = ''; cur.dispatchEvent(new Event('input', {bubbles:true})); cur.dispatchEvent(new Event('change', {bubbles:true})); cur.focus(); place(); });
})();
</script>
